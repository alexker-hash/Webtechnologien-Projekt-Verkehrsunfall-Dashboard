<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfallstatistiken</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <script src="dMap.js" defer></script>
    <script src="exportData.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="statistikenDiagramme.js" defer></script>
    <script>onload = function(){
            initMap();
        }</script>
</head>
<body>
    
    <div id="Statistics">Beispiel-Statistiken:</div>
    <br>
    <div id="Map">Leaflet-Karte
       
        <form id="uploadForm">
            <input type="file" id="fileInput" accept=".csv,.json">
            <button type="submit">CSV in Datenbank laden</button>
        </form>
    </div>



    <div id="SQL-Tabelle">Beispiel-SQL-Tabelle/AlleErgebnisse</div>
    
    
    

    <div id="StatistikenDiagramme">
        <h2>Statistiken &amp; Diagramme</h2>

        <!-- US-12: Drei Kennzahlen zur Auswahl -->
        <div id="kennzahlenContainer" class="kennzahlen-bereich">
            <div class="kennzahl-box">
                <span class="kennzahl-label">Unfälle insgesamt:</span>
                <strong id="kpiGesamt">0</strong>
            </div>
            <div class="kennzahl-box">
                <span class="kennzahl-label">Mit Radbeteiligung:</span>
                <strong id="kpiRad">0</strong>
            </div>
            <div class="kennzahl-box">
                <span class="kennzahl-label">Mit Schwerverletzten:</span>
                <strong id="kpiSchwerverletzte">0</strong>
            </div>
        </div>

        <!-- US-13: Monatliche Entwicklung (Zeitdiagramm) -->
        <div class="diagramm-box">
            <h3>Monatliche Entwicklung</h3>
            <canvas id="zeitDiagramm"></canvas>
        </div>

        <!-- US-14 & US-15: Verteilung der Unfallkategorien (Balkendiagramm + Klick-Filter) -->
        <div class="diagramm-box">
            <h3>Verteilung der Unfallkategorien</h3>
            <canvas id="kategorieDiagramm"></canvas>
            <div id="diagrammFilterSteuerung">
                <p id="diagrammFilterInfo">Aktiver Kategoriefilter: keiner</p>
                <button type="button" id="resetDiagrammFilterBtn" onclick="resetKategorieFilter()" disabled>
                    Kategoriefilter entfernen
                </button>
            </div>
        </div>
    </div>

    
</body>
</html>
